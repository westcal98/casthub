<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
  <title>CastHub Receiver</title>
  <script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
    cast-media-player {
      display: block;
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      --theme-hue: 210;
      --progress-color: #5b9ec9;
      --splash-image: none;
      --splash-background-color: #080808;
    }
  </style>
</head>
<body>
  <cast-media-player></cast-media-player>
  <script>
    window.addEventListener('load', function() {
      const context       = cast.framework.CastReceiverContext.getInstance();
      const playerManager = context.getPlayerManager();
      const options       = new cast.framework.CastReceiverOptions();
      options.disableIdleTimeout = true;
      options.maxInactivity = 3600;

      // ── Seek-offset time correction ────────────────────────────────
      // Each seek spawns a new HLS session starting at stream position 0.
      // The sender passes customData.seekOffset so the receiver can display
      // the real movie time instead of the stream-relative 0:00.
      let seekOffset    = 0;
      let movieDuration = 0;

      // Patch the two methods cast-media-player calls to drive its seek bar fill
      // and time text. Returns movie-relative values instead of stream-relative,
      // so the native bar shows correct position after seeks without shadow DOM guessing.
      const _origCurrentTime = playerManager.getCurrentTimeSec.bind(playerManager);
      const _origDuration    = playerManager.getDurationSec.bind(playerManager);
      playerManager.getCurrentTimeSec = function() { return _origCurrentTime() + seekOffset; };
      playerManager.getDurationSec    = function() {
        return movieDuration > 0 ? movieDuration : (_origDuration() + seekOffset);
      };

      playerManager.setMessageInterceptor(
        cast.framework.messages.MessageType.LOAD,
        function(request) {
          seekOffset    = (request.media && request.media.customData && request.media.customData.seekOffset) || 0;
          movieDuration = (request.media && request.media.duration) || 0;
          return request;
        }
      );

      function fmt(s) {
        s = Math.max(0, Math.floor(s));
        var h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
        return h > 0
          ? h + ':' + String(m).padStart(2, '0') + ':' + String(sec).padStart(2, '0')
          : m + ':' + String(sec).padStart(2, '0');
      }

      // Belt-and-suspenders: also patch shadow DOM time text nodes directly.
      // getCurrentTimeSec() is already movie-relative due to the patch above.
      playerManager.addEventListener(cast.framework.events.EventType.TIME_UPDATE, function() {
        var cur   = playerManager.getCurrentTimeSec();
        var total = playerManager.getDurationSec();
        var shadow = document.querySelector('cast-media-player') &&
                     document.querySelector('cast-media-player').shadowRoot;
        if (!shadow) return;
        var curEl = shadow.querySelector('.current-time');
        var endEl = shadow.querySelector('.end-time');
        if (curEl) curEl.textContent = fmt(cur);
        if (endEl) endEl.textContent = total > 0 ? fmt(total) : '';
      });

      context.start(options);

      // ── Shadow DOM patches ─────────────────────────────────────────
      function patchShadowDOM() {
        var player = document.querySelector('cast-media-player');
        if (!player || !player.shadowRoot) { setTimeout(patchShadowDOM, 500); return; }
        var style = document.createElement('style');
        style.textContent = [
          '.live-badge, .live-indicator, [class*="live"] { display: none !important; }',
          '.spinner-layer, .spinner, [class*="spinner"],',
          '.buffering-spinner, .loading-spinner { display: none !important; }',
          '.player-controls-bottom, .controls-container,',
          '.metadata-container, .progress-container {',
          '  left: 0 !important; right: 0 !important;',
          '  width: 100% !important; margin: 0 auto !important;',
          '  text-align: center !important; }'
        ].join('\n');
        player.shadowRoot.appendChild(style);
      }
      setTimeout(patchShadowDOM, 1000);
    });
  </script>
</body>
</html>
