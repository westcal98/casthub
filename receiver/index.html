<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
  <title>CastHub Receiver</title>
  <script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
    cast-media-player {
      display: block;
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      --theme-hue: 210;
      --progress-color: #5b9ec9;
      --splash-image: none;
      --splash-background-color: #080808;
    }
  </style>
</head>
<body>
  <cast-media-player></cast-media-player>
  <script>
    window.addEventListener('load', function() {
      const context = cast.framework.CastReceiverContext.getInstance();
      const options  = new cast.framework.CastReceiverOptions();
      options.disableIdleTimeout = true;
      options.maxInactivity = 3600;
      context.start(options);

      // Block seeks from the TV remote — our streams are piped (no byte-range support),
      // so native CAF seeks would stall. All seeking is handled by CastHub reloading the URL.
      const playerManager = context.getPlayerManager();
      playerManager.setMessageInterceptor(
        cast.framework.messages.MessageType.SEEK,
        () => null
      );

      // Inject CSS into cast-media-player shadow DOM
      // Hides: LIVE badge, loading spinner, and centers the metadata bar
      function patchShadowDOM() {
        const player = document.querySelector('cast-media-player');
        if (!player || !player.shadowRoot) {
          setTimeout(patchShadowDOM, 500);
          return;
        }
        const style = document.createElement('style');
        style.textContent = `
          /* Hide LIVE badge */
          .live-badge, .live-indicator, [class*="live"] { display: none !important; }
          /* Hide loading spinner that pushes bar right */
          .spinner-layer, .spinner, [class*="spinner"],
          .buffering-spinner, .loading-spinner { display: none !important; }
          /* Center the metadata / controls overlay */
          .player-controls-bottom, .controls-container,
          .metadata-container, .progress-container {
            left: 0 !important;
            right: 0 !important;
            width: 100% !important;
            margin: 0 auto !important;
            text-align: center !important;
          }
        `;
        player.shadowRoot.appendChild(style);
      }
      setTimeout(patchShadowDOM, 1000);
    });
  </script>
</body>
</html>
