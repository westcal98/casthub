<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CastHub</title>
  <link rel="stylesheet" href="styles.css"/>
</head>
<body>
<div id="titlebar">
  <span class="logo"><span class="logo-dot"></span>CastHub</span>
  <div class="spacer"></div>
  <div class="win-btns">
    <button class="win-btn wb-close"    id="btn-close"></button>
    <button class="win-btn wb-minimize" id="btn-minimize"></button>
    <button class="win-btn wb-maximize" id="btn-maximize"></button>
  </div>
</div>
<div id="app">
  <div id="sidebar">
    <div class="sidebar-header">Queue</div>
    <div id="queue-list">
      <div id="queue-empty" style="padding:20px 10px;text-align:center;color:var(--muted);font-size:.8rem;">No files added yet</div>
    </div>
    <button id="btn-add-files">+ Add Files</button>
    <div id="mobile-badge">
      <div class="mb-label">Mobile Remote</div>
      <div class="mb-ip" id="mobile-ip-display">Loading…</div>
      <div class="mb-hint">Enter this in mobile app → Settings</div>
    </div>
  </div>
  <div id="main">
    <div id="device-bar">
      <label>Cast to:</label>
      <select id="device-select"><option value="">Scanning for devices…</option></select>
      <button id="btn-disconnect" class="btn-disconnect hidden">⏹ Stop Casting</button>
      <div id="cast-badge" class="cast-badge" style="display:none">
        <span class="dot"></span><span id="cast-badge-label">Casting</span>
      </div>
    </div>
    <div id="stage">
      <div id="dropzone">
        <div class="dz-icon">🎬</div>
        <div class="dz-title">Drop a video to cast</div>
        <div class="dz-sub">MP4, MKV, AVI, HEVC and more.<br/>AC3/DTS audio transcoded automatically.</div>
        <button class="dz-btn" id="dz-btn-pick">Browse Files</button>
      </div>
      <div id="now-playing" style="display:none">
        <div class="np-device" id="np-device">Casting to —</div>
        <div class="np-thumb">🎬</div>
        <div class="np-title" id="np-title">—</div>
      </div>
    </div>
    <div id="resume-notice" style="display:none">
      <span id="resume-label"></span>
      <button id="btn-start-over">Start over</button>
      <button id="btn-resume-dismiss">✕</button>
    </div>
    <div id="controls-bar" style="display:none">
      <div class="seek-row">
        <span class="time-label" id="time-current">0:00</span>
        <input type="range" id="seek-bar" min="0" max="100" value="0" step="0.1"/>
        <span class="time-label right" id="time-total">0:00</span>
      </div>
      <div class="btns-row">
        <button class="ctrl-btn" id="btn-prev" title="Previous">⏮</button>
        <button class="ctrl-btn" id="btn-back">↩ 10</button>
        <button class="ctrl-btn primary" id="btn-playpause">⏸</button>
        <button class="ctrl-btn" id="btn-fwd">30 ↪</button>
        <button class="ctrl-btn danger" id="btn-stop" title="Stop">⏹</button>
        <button class="ctrl-btn" id="btn-next" title="Next">⏭</button>
      </div>
      <div class="vol-row">
        <span class="vol-icon">🔊</span>
        <input type="range" id="vol-bar" min="0" max="1" step="0.01" value="1"/>
        <button id="btn-autoplay" onclick="toggleAutoPlay()" style="margin-left:12px;padding:4px 10px;background:var(--card);border:1px solid var(--border);border-radius:6px;color:var(--muted);font-size:.72rem;cursor:pointer;white-space:nowrap;">🔁 Auto-play</button>
      </div>
    </div>
  </div>
</div>
<script src="renderer.js"></script>
</body>
</html>
